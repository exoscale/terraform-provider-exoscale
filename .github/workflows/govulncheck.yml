name: govulncheck

on:
  pull_request:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          check-latest: true
      - name: Install govulncheck
        run: go install github.com/exoscale/govulncheck/cmd/govulncheck@installable
        shell: bash
      - name: Run govulncheck
        run: govulncheck ./...
        shell: bash
