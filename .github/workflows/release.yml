name: Release

on:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  community-docs:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.EXOSCALE_BUILD_GH_TOKEN }}
    steps:
      # Only the highest release regenerates the community docs, so that a
      # patch release of an older version (e.g. v0.74.3 after v0.75.0) does
      # not replace the docs of the newer one.
      - shell: bash
        run: |
          latest=$(git ls-remote --tags --refs "https://github.com/${GITHUB_REPOSITORY}.git" 'v*' \
            | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          if [ "${GITHUB_REF_NAME}" != "${latest}" ]; then
            echo "::notice::${GITHUB_REF_NAME} is not the latest release (${latest}), not regenerating the community docs"
            exit 0
          fi
          gh workflow run gen-terraform.yaml -R exoscale/community-ng -f version="${GITHUB_REF_NAME}"
  goreleaser:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: make go.mk
        shell: bash

      - name: Import GPG key
        # This is a third-party GitHub action and we trust it with our GPG key.
        # To be on the safer side, we should always pin to the commit SHA.
        # It's not a perfect mitigation, but we should always do some due diligence before upgrading.
        # The author seems trustworthy, as the author is part of the docker and goreleaser organizations on GitHub.
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: ./go.mk/.github/actions/release
        with:
          release_github_token: ${{ secrets.GITHUB_TOKEN }}

  crossplane-provider:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.EXOSCALE_BUILD_GH_TOKEN }}
    steps:
      - name: Generate crossplane provider
        run: gh workflow run generate-code.yaml -R exoscale/provider-exoscale -f terraform_provider_version=${GITHUB_REF_NAME#v}
